name: Build Native Executables

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify GraalVM installation
        run: |
          echo "JAVA_HOME: $env:JAVA_HOME"
          java -version
          native-image --version

      - name: Build with Maven (JAR first)
        run: mvn clean package -DskipTests

      - name: Build Native Image
        run: |
          native-image `
            -jar target/double-pendulum-1.0.0.jar `
            -o target/double-pendulum `
            -H:+AddAllCharsets `
            -H:+ReportExceptionStackTraces `
            --no-fallback `
            -O2 `
            -Djava.awt.headless=false `
            --verbose

      - name: Report binary size
        run: |
          $exe = Get-Item "target/double-pendulum.exe"
          $sizeBytes = $exe.Length
          $sizeMB = [math]::Round($sizeBytes / 1MB, 2)

          Write-Host "============================================"
          Write-Host "BUILD SUCCESSFUL!"
          Write-Host "============================================"
          Write-Host ""
          Write-Host "Binary: double-pendulum.exe"
          Write-Host "Size: $sizeBytes bytes ($sizeMB MB)"
          Write-Host ""

          # Create size report
          @"
          # Build Report

          | Metric | Value |
          |--------|-------|
          | File | double-pendulum.exe |
          | Size (bytes) | $sizeBytes |
          | Size (MB) | $sizeMB |
          | Platform | Windows x64 |
          | GraalVM | 21 |
          "@ | Out-File -FilePath build-report.md

          Get-Content build-report.md

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: double-pendulum-windows
          path: target/double-pendulum.exe
          retention-days: 30

      - name: Upload build report
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: build-report.md

  build-linux:
    name: Build Linux Binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfreetype6-dev libfontconfig1-dev

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify GraalVM installation
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          java -version
          native-image --version

      - name: Build with Maven (JAR first)
        run: mvn clean package -DskipTests

      - name: Build Native Image
        run: |
          native-image \
            -jar target/double-pendulum-1.0.0.jar \
            -o target/double-pendulum \
            -H:+AddAllCharsets \
            -H:+ReportExceptionStackTraces \
            --no-fallback \
            -O2 \
            -Djava.awt.headless=false \
            --verbose

      - name: Report binary size
        run: |
          SIZE_BYTES=$(stat --printf="%s" target/double-pendulum)
          SIZE_MB=$(echo "scale=2; $SIZE_BYTES / 1048576" | bc)

          echo "============================================"
          echo "BUILD SUCCESSFUL!"
          echo "============================================"
          echo ""
          echo "Binary: double-pendulum"
          echo "Size: $SIZE_BYTES bytes ($SIZE_MB MB)"
          echo ""

          # Create size report
          cat > build-report-linux.md << EOF
          # Build Report (Linux)

          | Metric | Value |
          |--------|-------|
          | File | double-pendulum |
          | Size (bytes) | $SIZE_BYTES |
          | Size (MB) | $SIZE_MB |
          | Platform | Linux x64 |
          | GraalVM | 21 |
          EOF

          cat build-report-linux.md

      - name: Upload Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: double-pendulum-linux
          path: target/double-pendulum
          retention-days: 30

      - name: Upload build report
        uses: actions/upload-artifact@v4
        with:
          name: build-report-linux
          path: build-report-linux.md

  summary:
    name: Build Summary
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create summary
        run: |
          echo "# Double Pendulum Native Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Build Status" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Windows | ${{ needs.build-windows.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Linux | ${{ needs.build-linux.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Download" >> $GITHUB_STEP_SUMMARY
          echo "Download the executables from the Artifacts section above." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "These are standalone executables - no Java installation required!" >> $GITHUB_STEP_SUMMARY
