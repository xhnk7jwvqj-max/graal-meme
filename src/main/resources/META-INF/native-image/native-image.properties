# GraalVM Native Image configuration for Double Pendulum Swing application
Args = --no-fallback \
       --initialize-at-build-time=sun.awt.Win32GraphicsEnvironment \
       --initialize-at-build-time=sun.java2d.d3d.D3DGraphicsDevice \
       -H:+AddAllCharsets \
       -H:+ReportExceptionStackTraces \
       -Djava.awt.headless=false
